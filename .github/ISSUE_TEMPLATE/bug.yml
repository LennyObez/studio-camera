name: Bug Report
description: Report a bug in Studio Camera
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open '...'
        2. Tap '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      description: e.g., Pixel 8, iPhone 15 Pro
      placeholder: e.g., Pixel 8
    validations:
      required: false
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: e.g., Android 15, iOS 18.2
      placeholder: e.g., Android 15
    validations:
      required: false
  - type: dropdown
    id: app-version
    attributes:
      label: App version
      options:
        - main (development)
        - Other
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant information, logs, or screenshots.
    validations:
      required: false
