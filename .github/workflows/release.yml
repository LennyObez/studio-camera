name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          STUDIO_CAMERA_KEYSTORE_PATH: keystore.jks
          STUDIO_CAMERA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STUDIO_CAMERA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STUDIO_CAMERA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build release AAB
        env:
          STUDIO_CAMERA_KEYSTORE_PATH: keystore.jks
          STUDIO_CAMERA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STUDIO_CAMERA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STUDIO_CAMERA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
